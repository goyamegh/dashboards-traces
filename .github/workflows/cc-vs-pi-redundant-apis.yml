name: cc-vs-pi-redundant-apis

# A/B benchmark: run evals/cc-vs-pi-redundant-apis.eval.js against BOTH
# claude-code and pi (matrix → separate runners, so no shared-worktree
# contention), same prompt / judge / evaluator, and upload each agent's
# scored result as an artifact to compare.
#
# Non-gating + expensive (real Bedrock LLM calls for the agent AND the
# Opus-4.8 judge), so it is manual (workflow_dispatch) — never on push/PR.
# Requires a Bedrock role secret; skips cleanly where that isn't configured.
#
# NOTE: pin actions to commit SHAs before sending upstream (repo convention);
# version tags are used here for readability on the fork.

on:
  workflow_dispatch:
    inputs:
      published_version:
        description: "@goyamegh/agent-health version to run with"
        default: "0.5.21"
        required: true

permissions:
  contents: read
  id-token: write   # AWS OIDC → Bedrock

jobs:
  benchmark:
    # Bedrock creds only exist where BEDROCK_ROLE_ARN is set (skip on forks without it).
    if: ${{ github.repository == 'goyamegh/dashboards-traces' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false           # one agent failing shouldn't cancel the other
      matrix:
        include:
          - agent: claude-code
            model: claude-sonnet-4.6
          - agent: pi
            model: amazon-bedrock/anthropic.claude-sonnet-4-6
    env:
      AH_VERSION: ${{ github.event.inputs.published_version || '0.5.21' }}
      AH_PORT: "4191"                 # keep off the default :4001
      AWS_REGION: us-east-1
      AH_SUPPRESS_EXPERIMENTAL: "1"
      CLAUDE_CODE_USE_BEDROCK: "1"    # claude-code agent → Bedrock, not the Anthropic API
    steps:
      # The eval audits its working directory (CODEBASE_PATH = process.cwd()),
      # so the checked-out agent-health repo IS the codebase under audit.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Bedrock powers both the coding agent and the Opus-4.8 judge.
      - name: Configure AWS credentials (Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          aws-region: us-east-1

      # The agent binary. Adjust the package if your agent CLI differs.
      - name: Install Claude Code CLI
        if: matrix.agent == 'claude-code'
        run: npm i -g @anthropic-ai/claude-code

      - name: Install pi CLI
        if: matrix.agent == 'pi'
        run: curl -fsSL https://pi.dev/install.sh | bash && echo "$HOME/.pi/bin" >> "$GITHUB_PATH"

      # The eval judges with the custom `api-redundancy-correctness` evaluator.
      # Seed it into file storage once (persists in .agent-health/data/) so the
      # benchmark's ephemeral server resolves it. Embedded as base64 to keep this
      # to exactly two files (the eval + this workflow) with no escaping issues.
      - name: Seed custom evaluator
        run: |
          echo "" | base64 -d > /tmp/evaluator.json
          npx -y @goyamegh/agent-health@${AH_VERSION} serve -p "$AH_PORT" --no-browser &
          for i in $(seq 1 30); do curl -sf "localhost:${AH_PORT}/health" >/dev/null && break; sleep 2; done
          curl -sf -X POST "localhost:${AH_PORT}/api/storage/evaluators" \
            -H 'content-type: application/json' --data-binary @/tmp/evaluator.json

      # Mirrors the run command documented in the eval header. -m avoids the
      # demo-model mock; the eval itself pins the Opus-4.8 judge + evaluatorId
      # per judge() call, so no --judge-model here (its alias is broken in the
      # published pkg; the eval uses the raw profile id).
      - name: Run cc-vs-pi-redundant-apis (${{ matrix.agent }})
        run: |
          npx -y @goyamegh/agent-health@${AH_VERSION} benchmark \
            -f evals/cc-vs-pi-redundant-apis.eval.js \
            -a ${{ matrix.agent }} -m "${{ matrix.model }}" \
            --evaluator api-redundancy-correctness \
            --export "results-${{ matrix.agent }}.json" --format json \
            --stop-server -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redundant-apis-results-${{ matrix.agent }}
          path: results-*.json
